[package]
name = "marklark"
version = "0.1.1"
edition = "2024"
description = "Maintain Markdown documents: humans write intents, agents write hermetic Starlark, marklark runs it deterministically"
license = "MIT OR Apache-2.0"
repository = "https://github.com/verhas/marklark"
publish = true
exclude = [".github", ".claude", "npm"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "marklark"
path = "src/main.rs"

[dependencies]
# Pinned exactly: the AST hash uses marklark's own printer (D20), but dialect behaviour is still
# verified during development (D23).
starlark = "=0.14.3"
starlark_syntax = "=0.14.2"
blake3 = "1"
pulldown-cmark = { version = "0.13.6", default-features = false }
ignore = "0.4.35"
anyhow = "1.0.105"
globset = "0.4.22"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
clap = { version = "4.6.10", features = ["derive"] }
regex = "1.13.2"
toml = "1.2.3"
rmcp = { version = "3.12.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
yaml-rust2 = "0.13"
roxmltree = "0.21.2"
